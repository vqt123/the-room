<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kill or Save</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel=stylesheet>
<style>
/* The look is Alex Tov's comic mockups (#temp-hck-team-6, 2026-09-18): dark speed-line paper,
   cream panels with heavy ink borders, gold bursts, and a secret team card. Every texture is
   CSS, so there is nothing to download and nothing to keep in sync. */
:root{
  --ink:#191c21; --slate-d:#2a323c;
  --cream:#f6efdc; --paper:#efe5c8; --gold:#e9bb3f;
  --green-hi:#a6e84e; --red-hi:#ff7a5c;
  --mut:#9aa6b4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--slate-d);color:var(--cream);
  font:16px/1.5 "Comic Neue",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(circle at 50% 42%, #47525f 0%, #333c47 46%, #232a33 100%)}
.bg:before{content:"";position:absolute;inset:-20%;background:
  repeating-conic-gradient(from 0deg at 50% 42%,
    rgba(20,25,32,.42) 0deg .9deg, rgba(255,255,255,0) .9deg 2.6deg,
    rgba(20,25,32,.22) 2.6deg 3.4deg, rgba(255,255,255,0) 3.4deg 5.4deg)}
.bg:after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle, rgba(15,19,25,.5) 1.3px, rgba(0,0,0,0) 1.6px) 0 0/9px 9px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 30%, #000 85%);
  mask-image:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 30%, #000 85%)}

.wrap{max-width:560px;margin:0 auto;padding:14px 16px 72px}
.display{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.045em;
  transform:skewX(-7deg);text-transform:uppercase;line-height:1}
.topbar{display:flex;align-items:center;gap:10px;min-height:26px;margin-bottom:12px}
.topbar .who{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.06em;
  font-size:19px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.topbar .dot{margin-left:auto;width:11px;height:11px;border-radius:50%;background:var(--green-hi);
  box-shadow:0 0 10px rgba(166,232,78,.8)}

.logo{display:block;width:min(74%,300px);margin:22px auto 8px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.room{text-align:center;color:var(--mut);font-size:15px;margin-bottom:26px}

.panel{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:3px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);padding:14px 16px;position:relative}
.panel:before{content:"";position:absolute;inset:4px;border:1.5px solid rgba(25,28,33,.45);
  pointer-events:none;border-radius:2px}
.panel .n{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.09em;
  font-size:13px;color:#6c6350;margin-bottom:4px}
.caption{font-size:16px;line-height:1.45;font-weight:700}

input[type=text]{width:100%;padding:16px 14px;border:4px solid var(--ink);border-radius:3px;
  background:var(--cream);color:var(--ink);font:700 19px/1.2 "Comic Neue",sans-serif;text-align:center;
  box-shadow:0 5px 0 rgba(0,0,0,.35);outline:none}
input[type=text]::placeholder{color:#8a7f66}
input[type=text]:focus{border-color:#000;box-shadow:0 5px 0 rgba(0,0,0,.5),0 0 0 3px rgba(233,187,63,.45)}

button{width:100%;position:relative;border:0;cursor:pointer;padding:0;background:none}
.btn{display:block;width:100%;border:3px solid #7f8894;border-radius:4px;padding:3px;background:#5c6672;
  box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn i{display:block;padding:15px 10px;border-radius:2px;color:#3b2f10;font-style:normal;
  font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.07em;font-size:21px;
  background:
    radial-gradient(circle, rgba(0,0,0,.22) 1.1px, rgba(0,0,0,0) 1.4px) 0 0/7px 7px,
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(120,88,15,.30) 0deg .8deg, rgba(255,255,255,0) .8deg 3deg),
    radial-gradient(circle at 50% 50%, #f6d46a 0%, #e9bb3f 42%, #c8922c 100%)}
button:active .btn{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.45;cursor:default}
button:disabled .btn{transform:none}

.burstwrap{text-align:center;margin:22px 0 6px}
.burst{width:170px;height:170px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle, rgba(120,88,15,.32) 1.2px, rgba(0,0,0,0) 1.5px) 0 0/7px 7px,
    radial-gradient(circle at 50% 50%, #ffe9a6 0%, #f3cc55 38%, #dda32c 72%, #b8801f 100%)}
.burst span{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);font-size:54px;color:#fff;
  text-shadow:3px 3px 0 #1a1207, -2px -2px 0 rgba(0,0,0,.5)}
.bcap{color:var(--mut);font-size:14px;margin-top:8px}

.qlabel{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.06em;font-size:21px;
  color:var(--gold);text-shadow:2px 2px 0 rgba(0,0,0,.5);margin:18px 0 9px}
.qlabel.kill{color:#ff8a76}.qlabel.save{color:var(--green-hi)}
.stack{display:grid;gap:11px}
.status{min-height:20px;font-size:14px;color:var(--mut);margin-top:9px}
.status.err{color:#ff8a76}.status.ok{color:var(--green-hi)}
.hint{color:var(--mut);font-size:13px;margin-top:10px}

h3{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.08em;font-size:15px;
  color:var(--mut);margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:rgba(20,25,32,.55);border:2px solid rgba(246,239,220,.28);border-radius:999px;
  padding:6px 13px;font-size:15px;font-weight:700}
.chip.mine{background:var(--gold);border-color:var(--ink);color:#3b2f10}

.cardwrap{padding:6px 0 0}
/* Alex Tov's card art (#temp-hck-team-6, 2026-09-18) is the card; the words sit on top of it.
   The card starts face down and flips over when the player taps it, so nobody reads a side over
   your shoulder before you are ready. */
.flip{perspective:1200px}
.flip .inner{position:relative;aspect-ratio:896/1200;transition:transform .75s cubic-bezier(.3,1.3,.5,1);
  transform-style:preserve-3d;cursor:pointer}
.flip.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#2b1a16 center/cover no-repeat;
  box-shadow:0 8px 0 rgba(0,0,0,.4);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{background-image:url(assets/card-back.jpg)}
.face.front{transform:rotateY(180deg)}
.card.kill .face.front{background-image:url(assets/card-kill.jpg)}
.card.save .face.front{background-image:url(assets/card-save.jpg)}
.tapme{position:absolute;left:0;right:0;bottom:6%;text-align:center;color:#f6efdc;font-weight:700;
  font-size:min(3.8vw,15px);text-shadow:1px 1px 0 rgba(0,0,0,.85);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.face.front .title{position:absolute;left:0;right:0;top:6.5%;font-family:Bangers,Impact,sans-serif;
  transform:skewX(-7deg);font-size:min(9.5vw,42px);color:#fff;letter-spacing:.03em;text-align:center;
  text-shadow:3px 3px 0 #17190f,-2px -2px 0 rgba(0,0,0,.5)}
.face.front .sub{position:absolute;left:24%;right:24%;top:28%;height:14%;display:flex;align-items:center;
  justify-content:center;text-align:center;font-weight:700;font-size:min(4.4vw,19px);color:#221a12;line-height:1.2}
.face.front .foot{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:min(3.4vw,14px);
  font-weight:700;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.85)}
.reveal{margin-top:14px}
.peek{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--mut);
  font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}

.page img{width:100%;display:block;border:4px solid var(--ink);border-radius:3px;background:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.4)}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#fff;
  border:4px solid var(--ink);border-radius:3px}
.spanel{position:relative;background:#fff;border:2px solid var(--ink);border-radius:2px;overflow:hidden;color:#111}
.spanel img{width:100%;display:block}
.spanel .cap{font-size:12px;border-top:2px solid var(--ink);padding:4px 6px;font-weight:700}
.title2{font-size:26px;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.55);margin:18px 0 10px}
.beats{margin:12px 0 0;padding:0;list-style:none;counter-reset:b;display:grid;gap:8px}
.beats li{counter-increment:b;position:relative;padding:11px 12px 11px 44px;background:var(--cream);
  color:var(--ink);border:3px solid var(--ink);border-radius:3px;font-size:14px;line-height:1.4;font-weight:700}
.beats li:before{content:counter(b);position:absolute;left:9px;top:9px;width:25px;height:25px;
  background:var(--gold);border:2px solid var(--ink);border-radius:3px;
  font-family:Bangers,Impact,sans-serif;font-size:15px;color:#3b2f10;text-align:center;line-height:22px}
/* While a round is being made the phone must say so loudly: the host presses Go on the other
   side of the room and nothing else on this screen changes (Vinh, 2026-09-18). */
.busy{margin:0 0 18px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);
  border-radius:5px;padding:14px 15px 13px;box-shadow:0 6px 0 rgba(0,0,0,.4);
  animation:bin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes bin{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.busy .row{display:flex;align-items:center;gap:11px}
.busy .head{font-family:Bangers,Impact,sans-serif;transform:skewX(-7deg);letter-spacing:.05em;
  font-size:25px;line-height:1.05;color:var(--ink)}
.busy .secs{margin-left:auto;font-weight:700;font-size:14px;color:#6c6250;flex:0 0 auto}
.busy .sub{margin-top:5px;font-size:14px;font-weight:700;color:#4a4436}
.busy .note{margin-top:3px;font-size:13px;color:#6c6250}
.bar{margin-top:10px;height:11px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;
  background:#ddd2b0}
.bar span{display:block;height:100%;width:0;background:
  repeating-linear-gradient(115deg,#e9bb3f 0 13px,#f6d46a 13px 26px);
  transition:width .35s linear}
.dots:after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.spin{width:22px;height:22px;border:4px solid rgba(25,28,33,.2);border-top-color:var(--ink);
  border-radius:50%;animation:s .8s linear infinite;flex:0 0 auto}
@keyframes s{to{transform:rotate(360deg)}}
#answer.shut{opacity:.45;pointer-events:none}
</style>
<div class=bg></div>
<div class=wrap>

<div class=topbar><span class=who id=who></span><span class=dot id=dot style="display:none"></span></div>

<div id=joincard>
  <img class=logo src="assets/logo.png" alt="Dumbest Ways to Die">
  <div class=room id=room>Room</div>
  <div class=stack>
    <input type=text id=name placeholder="Your name" maxlength=14 autocomplete=off>
    <button id=join><span class=btn><i>Join room</i></span></button>
  </div>
  <div class=status id=joinst></div>
</div>

<div id=teamcard class=cardwrap style="display:none">
  <div class="card flip" id=card>
    <div class=inner id=cardinner>
      <div class="face back"><div class=tapme id=tapme>tap to see your side</div></div>
      <div class="face front">
        <div class=title id=cardtitle></div>
        <div class=sub id=cardsub></div>
        <div class=foot>Your team is secret. Don't show anyone.</div>
      </div>
    </div>
  </div>
  <div class=reveal><button id=gotit><span class=btn><i>Got it</i></span></button></div>
</div>

<div id=game style="display:none">
  <div class=panel id=scene style="display:none"><div class=n>The story so far</div><div class=caption id=scenetext></div></div>

  <div id=next></div>

  <div class=burstwrap><div class=burst id=burst><span id=burstnum>0</span></div><div class=bcap id=bcap></div></div>

  <div id=answer>
    <div class=qlabel id=question>&nbsp;</div>
    <div class=stack>
      <input type=text id=idea placeholder="e.g. a falling piano" maxlength=64 autocomplete=off autocapitalize=off>
      <button id=add><span class=btn><i>Lock it in</i></span></button>
    </div>
    <div class=status id=addst></div>
    <div class=hint id=hint></div>
  </div>

  <h3>Everyone's answers</h3>
  <div class=chips id=ideas></div>
  <button class=peek id=peek>show my team again</button>
  <div id=strip></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
// A 24-point comic burst, built once and shared by the number badge and the team card star.
(function(){
  const pts=[]; for(let i=0;i<24;i++){const a=(i*15-90)*Math.PI/180, r=i%2?31:50;
    pts.push((50+r*Math.cos(a)).toFixed(1)+'% '+(50+r*Math.sin(a)).toFixed(1)+'%');}
  const st=document.createElement('style');
  st.textContent='.burst,.card .star{clip-path:polygon('+pts.join(',')+')}';
  document.head.appendChild(st);
})();
const SESS=(new URLSearchParams(location.search).get('sess')||'main').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||'main';
$('#room').textContent='Room '+SESS.toUpperCase();
let VOTER=localStorage.getItem('room_voter');
if(!VOTER){VOTER=Math.random().toString(36).slice(2,12).replace(/[^a-z0-9]/g,'x');localStorage.setItem('room_voter',VOTER);}
let NAME=localStorage.getItem('room_name')||'';
$('#name').value=NAME;
let st=null, joined=false, shown='', filledRound=0, cardSeen=false, heroName='Yoland';
const PANEL_GAP_MS=1000;   // silence between panels while Yoland reads

async function api(body){
  const r=await fetch('/api/kill',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({sess:SESS,voter:VOTER,name:NAME},body))});
  return r.json();
}
async function pull(){
  const r=await fetch(`/api/kill?sess=${encodeURIComponent(SESS)}&voter=${VOTER}`);
  return r.json();
}
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

function showCard(team){
  $('#card').className='card flip '+team;
  $('#cardtitle').textContent=(team==='kill'?'Kill ':'Save ')+heroName;
  $('#cardsub').textContent=team==='kill'?'Make it spectacular.':'Make it heroic.';
  $('#joincard').style.display='none'; $('#game').style.display='none';
  $('#teamcard').style.display='';
}
$('#cardinner').onclick=()=>{ $('#card').classList.add('open'); $('#tapme').style.display='none'; };
$('#gotit').onclick=()=>{ cardSeen=true; $('#teamcard').style.display='none'; $('#game').style.display=''; $('#idea').focus(); };
$('#peek').onclick=()=>{ if(st&&st.me) showCard(st.me.team); };

function enter(team){
  joined=true; $('#dot').style.display='';
  $('#who').textContent=NAME.toUpperCase();
  if(!cardSeen){ showCard(team); } else { $('#joincard').style.display='none'; $('#game').style.display=''; }
  tick();
}
$('#join').onclick=async()=>{
  NAME=$('#name').value.trim();
  if(!NAME){$('#joinst').className='status err';$('#joinst').textContent='Name first.';return;}
  localStorage.setItem('room_name',NAME);
  const g=await api({action:'join'});
  if(g.error){$('#joinst').className='status err';$('#joinst').textContent=g.error;return;}
  enter(g.team);
};
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')$('#join').click();});
$('#idea').addEventListener('keydown',e=>{if(e.key==='Enter')$('#add').click();});
$('#add').onclick=async()=>{
  const t=$('#idea').value.trim(); if(!t) return;
  $('#add').disabled=true;
  try{
    const g=await api({action:'say',idea:t});
    if(g.error){$('#addst').className='status err';$('#addst').textContent=g.error;}
    else{$('#addst').className='status ok';$('#addst').textContent='Locked in: '+g.idea;}
    await tick();
  }catch(e){}
  $('#add').disabled=false;
};

function pageHtml(cur){
  let body='';
  if(cur.image){ body=`<div class=page><img src="${cur.image}" alt="comic page ${cur.round}"></div>`; }
  else if(cur.images){
    body='<div class=strip>'+cur.images.map((u,i)=>{const p=cur.panels[i]||{};
      return `<div class=spanel><img src="${u}" alt="panel ${i+1}">`+
        `<div class=cap>${esc(p.text||p.caption||'')}</div></div>`;}).join('')+'</div>';
  }
  const beats=(cur.panels||[]).map(p=>p.text||p.caption||'').filter(Boolean);
  const told = beats.length ? `<ol class=beats>${beats.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>` : '';
  const clips=(cur.audio||[]);
  const hear = clips.length ? `<button class=peek id=hear>&#9654; hear ${esc(heroName)} tell it</button>` : '';
  return `<div class="title2 display">Round ${cur.round}: ${esc(cur.title||'')}</div>`+body+told+hear;
}

// The three stages a round goes through, with how long each usually takes, so the bar moves at
// about the right speed instead of jumping.
function stageCopy(stage){
  if(stage==='writing') return {h:'Smashing your words together',
    s:'Every answer in the pot is going into one story.',
    n:'Answers for this round are closed.', t:45};
  if(stage==='voicing') return {h:heroName+' is finding his voice',
    s:'Recording him narrating all four panels.',
    n:'Almost on screen.', t:12};
  return {h:'Drawing the comic', s:'Four panels, one page, drawn in one shot.',
    n:'You can already answer for the next round.', t:20};
}
let busyD=null, busyKey='', skew=0;
function renderBusy(){
  const d=st&&st.drawing;
  if(!d){ busyD=null; if(busyKey){ busyKey=''; $('#next').innerHTML=''; } $('#answer').classList.remove('shut'); return; }
  busyD=d;
  const stage=d.stage||'drawing', S=stageCopy(stage), key=d.round+':'+stage;
  if(key!==busyKey){
    busyKey=key;
    $('#next').innerHTML='<div class=busy>'
      +'<div class=row><span class=spin></span><div class=head>'+esc(S.h)+'<span class=dots></span></div>'
      +'<span class=secs id=busysecs></span></div>'
      +'<div class=sub>'+esc(S.s)+'</div>'
      +'<div class=bar><span id=busybar></span></div>'
      +'<div class=note>'+esc(S.n)+'</div></div>';
  }
  // While the story is being written the pot is already closed: anything typed now would be
  // read by nobody, so the field shuts rather than quietly losing the answer.
  $('#answer').classList.toggle('shut', stage==='writing');
  paintBusy();
}
function paintBusy(){
  if(!busyD) return;
  const el=document.getElementById('busysecs'), bar=document.getElementById('busybar');
  if(!el||!bar) return;
  const secs=Math.max(0,(Date.now()+skew-busyD.ms)/1000);
  el.textContent=Math.round(secs)+'s';
  bar.style.width=Math.min(96, 6+secs/stageCopy(busyD.stage||'drawing').t*90)+'%';
}
setInterval(paintBusy,250);

function render(){
  const me=st.me;
  heroName=st.hero_name||heroName;
  const over = st.finished || st.round>st.total_rounds;
  if(me){ $('#question').className='qlabel '+me.team; $('#question').textContent=st.question||''; }
  $('#burstnum').textContent = over ? '!' : st.answers;
  $('#bcap').textContent = over ? 'the end' : 'answers in for round '+st.round+' of '+st.total_rounds;
  const so = over ? 'The End. The host can start a new game.' : (st.so_far || '');
  $('#scene').style.display = so ? '' : 'none';
  $('#scenetext').textContent = so;
  $('#answer').style.display = over ? 'none' : '';
  $('#hint').textContent = over ? '' : 'Change it any time before the host hits Go.';
  if(filledRound!==st.round){ filledRound=st.round; $('#idea').value=(st.mine&&st.mine.idea)||''; if(!st.mine) $('#addst').textContent=''; }
  const mine=st.mine?st.mine.idea:'';
  $('#ideas').innerHTML=st.ideas.map(w=>`<span class="chip${w===mine?' mine':''}">${esc(w)}</span>`).join('')||'<span class=hint>Nothing yet.</span>';
  renderBusy();
  const cur=st.current;
  const key=cur ? cur.round+':'+(cur.image||(cur.images||[]).join('|')) : '';
  if(key!==shown){
    shown=key; $('#strip').innerHTML = cur ? pageHtml(cur) : '';
    const h=document.getElementById('hear');
    if(h) h.onclick=()=>{ const list=cur.audio||[]; let i=0;
      const a=new Audio();
      // A beat of silence between panels, the same as the big screen.
      // The same gap as the big screen, so a phone and the projector stay in step.
      a.onended=a.onerror=()=>{ if(++i<list.length) setTimeout(()=>{ a.src=list[i]; a.play().catch(()=>{}); },PANEL_GAP_MS); };
      a.src=list[0]; a.play().catch(()=>{}); };
  }
}
async function tick(){
  if(!joined) return;
  try{
    st=await pull();
    if(st.error){ $('#addst').className='status err'; $('#addst').textContent=st.error; return; }
    skew=st.now-Date.now();
    if(st.drawing){ api({action:'advance'}).catch(()=>{}); }
    render();
  }catch(e){}
}
// Faster while a round is being made: the stage changes are the feedback, so they should not
// sit a poll behind.
(function loop(){ setTimeout(async()=>{ await tick(); loop(); }, st&&st.drawing?1200:2500); })();
if(NAME){ api({action:'join'}).then(g=>{ if(!g.error){ cardSeen=!!g.returning; enter(g.team); } }).catch(()=>{}); }
</script>
