<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kill or Save</title>
<style>
:root{--bg:#0b0d12;--card:#161922;--ink:#eceff5;--mut:#8f97a6;--acc:#ffd23c;--ok:#5ddc97;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:28px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a2f3a;background:#0b0d12;color:var(--ink);font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--acc);color:#1a1400;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:13px;color:var(--mut)}
.status{min-height:20px;font-size:14px}.status.err{color:var(--bad)}.status.ok{color:var(--ok)}
.team{border-radius:14px;padding:16px;margin-bottom:12px;text-align:center}
.team.kill{background:#3a1416;border:2px solid var(--bad)}.team.save{background:#12352a;border:2px solid var(--ok)}
.team b{display:block;font-size:30px;letter-spacing:.08em}
.team.kill b{color:var(--bad)}.team.save b{color:var(--ok)}
.team span{font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#222736;border-radius:999px;padding:6px 12px;font-size:15px}
.chip.mine{background:var(--acc);color:#1a1400;font-weight:700}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#fff;border-radius:8px;line-height:1.3;margin-bottom:12px}
.panel{position:relative;background:#fff;border:2px solid #111;border-radius:4px;overflow:hidden}
.panel img{width:100%;display:block;background:#fff}
.panel .cap{font-size:12px;color:#111;border-top:2px solid #111;padding:4px 6px;font-weight:600}
.panel .num{position:absolute;top:4px;left:4px;background:var(--acc);color:#1a1400;font-weight:800;border-radius:4px;padding:0 6px;font-size:12px;line-height:1.5}
.busy{padding:14px;line-height:1.5;font-size:15px}.busy .n{color:var(--mut);font-size:13px;margin-top:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:var(--ink);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
<div class=wrap>
<h1>Kill or Save</h1>
<p class=sub>One character: <b id=heroname>Yoland</b>. Two secret teams. Drop single words into the shared pot. Everyone sees every word; nobody knows whose it is or which side it serves.</p>

<div class=card id=joincard>
  <div class=row><input type=text id=name placeholder="your name" maxlength=14><input type=password id=pw placeholder="password" style="max-width:150px"></div>
  <div class=row style="margin-top:10px"><button id=join style="flex:1">Join and get a side</button></div>
  <div class=status id=joinst></div>
</div>

<div id=game style="display:none">
  <div class=team id=team></div>
  <div class=card>
    <div class=row><input type=text id=text placeholder="one word" maxlength=24 autocomplete=off autocapitalize=off><button id=add>Add</button></div>
    <div class=status id=addst></div>
    <div class=small>In the pot for comic <b id=round>1</b>: <b id=count>0</b> words. Yours are yellow. <span id=cap></span></div>
    <div class=chips id=feed></div>
  </div>
  <div id=next></div>
  <div class=card><div class=small style="margin-bottom:8px" id=shead>The comic</div><div id=strip><p class=small>No comic yet. The big screen presses Go.</p></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const SESS=(new URLSearchParams(location.search).get('sess')||'main').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||'main';
let VOTER=localStorage.getItem('room_voter');
if(!VOTER){VOTER=Math.random().toString(36).slice(2,12).replace(/[^a-z0-9]/g,'x');localStorage.setItem('room_voter',VOTER);}
let PW=localStorage.getItem('stm_pw')||'', NAME=localStorage.getItem('room_name')||'';
$('#pw').value=PW; $('#name').value=NAME;
let st=null, joined=false, shownStrip='';

async function api(body){
  const r=await fetch('/api/kill',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({sess:SESS,password:PW,voter:VOTER,name:NAME},body))});
  return r.json();
}
async function pull(){
  const r=await fetch(`/api/kill?sess=${encodeURIComponent(SESS)}&password=${encodeURIComponent(PW)}&voter=${VOTER}`);
  return r.json();
}
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

function enter(){ joined=true; $('#joincard').style.display='none'; $('#game').style.display=''; tick(); }
$('#join').onclick=async()=>{
  NAME=$('#name').value.trim(); PW=$('#pw').value;
  if(!NAME){$('#joinst').className='status err';$('#joinst').textContent='name?';return;}
  localStorage.setItem('room_name',NAME); localStorage.setItem('stm_pw',PW);
  const g=await api({action:'join'});
  if(g.error){$('#joinst').className='status err';$('#joinst').textContent=g.error;return;}
  enter(); $('#text').focus();
};
for(const id of ['#name','#pw']) $(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('#join').click();});
$('#text').addEventListener('keydown',e=>{if(e.key==='Enter')$('#add').click();});
$('#add').onclick=async()=>{
  const t=$('#text').value.trim(); if(!t) return;
  $('#add').disabled=true;
  try{
    const g=await api({action:'word',text:t});
    if(g.error){$('#addst').className='status err';$('#addst').textContent=g.error;}
    else{$('#addst').className='status ok';$('#addst').textContent=g.dup?'"'+g.word+'" is already in the pot':'"'+g.word+'" is in the pot'; $('#text').value='';}
    await tick();
  }catch(e){}
  $('#add').disabled=false; $('#text').focus();
};

function render(){
  const me=st.me, H=esc(st.hero_name);
  if(me){
    $('#team').className='team '+me.team;
    $('#team').innerHTML = me.team==='kill'
      ? '<span>your secret side</span><b>KILL</b><span>'+H+' must not make it to the end. Your words are his doom.</span>'
      : '<span>your secret side</span><b>SAVE</b><span>Keep '+H+' going as long as you can. Your words are his rescues.</span>';
  }
  $('#heroname').textContent=st.hero_name;
  $('#round').textContent=st.round; $('#count').textContent=st.feed_count;
  $('#cap').textContent=st.my_words.length>=st.words_per_person?'You are at the cap for this comic.':'';
  const mine=new Set(st.my_words);
  $('#feed').innerHTML=st.feed.map(f=>`<span class="chip${mine.has(f.word)?' mine':''}">${esc(f.word)}</span>`).join('')
    || '<span class=small>the pot is empty, add a word</span>';
  const d=st.drawing;
  $('#next').innerHTML = d ? `<div class="card busy"><span class=spin></span><b>smashing ${d.words} words into a comic</b> - ${Math.max(0,Math.round((st.now-d.ms)/1000))}s`
    +`<div class=n>the storyteller writes four panels, then each is drawn with ${H} in it; about 45 seconds. Keep adding words for the next one.</div></div>` : '';
  const cur=st.current;
  const key=cur ? cur.round+':'+(cur.captions||[]).join('|') : '';
  if(key!==shownStrip){
    shownStrip=key;
    $('#shead').textContent = cur ? 'Comic '+cur.round+', from: '+cur.all_words.join(', ') : 'The comic';
    $('#strip').innerHTML = cur ? '<div class=strip>'+cur.panels.map((u,i)=>
      `<div class=panel><span class=num>${i+1}</span><img src="${u}" alt="panel ${i+1}"><div class=cap>${esc((cur.captions||[])[i]||'')}</div></div>`).join('')+'</div>'
      : '<p class=small>No comic yet. The big screen presses Go.</p>';
  }
}
async function tick(){
  if(!joined) return;
  try{
    st=await pull();
    if(st.error){ $('#addst').className='status err'; $('#addst').textContent=st.error; return; }
    if(st.drawing){ api({action:'advance'}).catch(()=>{}); }
    render();
  }catch(e){}
}
setInterval(tick,2500);
if(NAME && PW){ api({action:'join'}).then(g=>{ if(!g.error) enter(); }).catch(()=>{}); }
</script>
